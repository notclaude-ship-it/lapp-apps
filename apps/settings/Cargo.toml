[package]
name = "settings"
version = "1.3.0"
edition = "2021"
description = "Réglages tactiles pour lapp"

[dependencies]
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "wayland-dlopen", "rwh_06"] }
softbuffer = "0.4"
tiny-skia = "0.11"
ab_glyph = "0.2"
glutin = { version = "0.32", default-features = false, features = ["egl", "x11"] }
glutin-winit = { version = "0.5", default-features = false, features = ["egl", "x11"] }
glow = "0.16"
libc = "0.2"
x11rb = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
