# Egaliseur 5 bandes pour l'app Spotify de lapp : processus PipeWire client qui expose un sink virtuel
# "lapp_eq_sink" (filter-chain, filtres biquad) et le renvoie vers la sortie audio par defaut.
# Les gains sont modifies a chaud par l'app (pw-cli ... Props "eq_band_N:Gain").
context.properties = {
    log.level = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Egaliseur"
            media.name       = "Egaliseur"
            filter.graph = {
                nodes = [
                    { type = builtin name = eq_band_1 label = bq_lowshelf  control = { "Freq" = 60.0    "Q" = 0.7 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_2 label = bq_peaking   control = { "Freq" = 230.0   "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_3 label = bq_peaking   control = { "Freq" = 910.0   "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_4 label = bq_peaking   control = { "Freq" = 3600.0  "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_5 label = bq_highshelf control = { "Freq" = 14000.0 "Q" = 0.7 "Gain" = 0.0 } }
                ]
                links = [
                    { output = "eq_band_1:Out" input = "eq_band_2:In" }
                    { output = "eq_band_2:Out" input = "eq_band_3:In" }
                    { output = "eq_band_3:Out" input = "eq_band_4:In" }
                    { output = "eq_band_4:Out" input = "eq_band_5:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "lapp_eq_sink"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name    = "lapp_eq_out"
                node.passive = true
            }
        }
    }
]
