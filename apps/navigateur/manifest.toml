manifest_version = 1
id          = "com.atalo.navigateur"
name        = "Navigateur"
version     = "1.0.1"
arch        = "aarch64"
exec        = "bin/navigateur"
icon        = "icon.png"
# display : écran | storage : /data | gpu : OpenGL ES (partage le réseau) | audio | network | files | system | install
permissions = ["display", "network", "storage", "gpu"]